  const items=[[n,'등록 앱'],[store,'스토어 출시'],[rev+'/'+n,'수익모델'],[avgM,'평균 성숙도'],[avgC+'%','평균 완성도(스캔)'],[hub+'·'+anal,'피드백허브·분석']];
  document.getElementById('roll').innerHTML=items.map(x=>`<div class="rc"><div class="v">${x[0]}</div><div class="l">${x[1]}</div></div>`).join('');
}

let SORT='maturity';
document.getElementById('sortctl').addEventListener('click',e=>{
  if(e.target.dataset.s){SORT=e.target.dataset.s;[...e.currentTarget.children].forEach(b=>b.classList.toggle('on',b===e.target));render();}
});
function render(){
  const q=document.getElementById('q').value.trim().toLowerCase();
  const fm=document.getElementById('fmodel').value;
  let list=DATA.filter(a=>(!q||a.name.toLowerCase().includes(q)||(a.nameEn||'').toLowerCase().includes(q))&&(!fm||a.model===fm));
  list.sort((a,b)=> SORT==='name'?a.name.localeCompare(b.name,'ko'): SORT==='complete'?completeness(b)-completeness(a): b.maturity-a.maturity);
  document.getElementById('count').textContent=list.length+'개 표시';
  document.getElementById('grid').innerHTML=list.map(a=>{
    const p=a.maturity, mk=MODEL_KR[a.model], mc=MODEL_CLS[a.model];
    const pips=[['피드백',a.feedbackHub?1:(a.feedbackSoft?1:(a.repoFound?0:-1))],['분석',val(a,'analytics','t')],
      ['데이터',a.scanned?(a.m.cloud?1:(a.m.localdb?1:0)):-1],['테스트',val(a,'tests','m')]];
    const pipH=pips.map(x=>`<span class="pip ${x[1]===1?'on':x[1]===0?'off':'unk'}">${x[0]}</span>`).join('');
    const rt=a.rating?`<span class="star">★${a.rating}</span> <span class="muted">${a.ratingCount?'('+a.ratingCount+')':''}</span>`:'<span class="muted">평점 —</span>';
    return `<div class="card" onclick="openM('${a.name.replace(/'/g,"\\'")}')">
      <div class="ring" style="--p:${p};--c:${ringColor(p)}"><i>${p}</i></div>
      <div class="cn">${a.name}</div><div class="ce">${a.nameEn||''} · v${a.ver||'—'}</div>
      <span class="b ${mc}">${mk}</span> ${a.iap?'<span class="b" style="border:1px solid var(--line);color:var(--muted)">IAP</span>':''}
      <div style="margin-top:8px">${rt}</div>
      <div class="mrow">${pipH}</div>
    </div>`;
  }).join('');
}

function icon(v){return v===1?'<span class="ic y">✓</span>':v===0?'<span class="ic n">✕</span>':'<span class="ic u">?</span>';}
function openM(name){
  const a=DATA.find(x=>x.name===name); if(!a)return;
  const p=a.maturity, comp=completeness(a);
  const axes=AXES.map(([label,mx])=>{const v=a.parts[label]||0;const pct=Math.round(100*v/mx);
    return `<div class="ax"><span class="axl">${label}</span><span class="axb"><span class="axf" style="width:${pct}%"></span></span><span class="axn">${v}</span></div>`;}).join('');
  const cats=CATS.map(([ic,title,items])=>{
    let y=0,t=0; const lis=items.map(([k,l,s])=>{const v=val(a,k,s); if(v>=0){t++;if(v===1)y++;} return `<li>${icon(v)}${l}</li>`;}).join('');
    return `<div class="catbox"><div class="h"><span>${ic}</span>${title}<span class="cc">${y}/${t}</span></div><ul>${lis}</ul></div>`;
  }).join('');
  const st=a.stats||{}; const done=st.done||0,tot=st.totalTasks||0;
  const iap=a.iap&&a.iapItems&&a.iapItems.length?`<div class="iap">인앱: ${a.iapItems.map(s=>s.replace('/',' · ')).join(' / ')}</div>`:'';
  let links='';
  if(a.appStoreUrl)links+=`<a class="mlink" href="${a.appStoreUrl}" target="_blank">App Store ↗</a>`;
  if(a.supportUrl)links+=`<a class="mlink" href="${a.supportUrl}" target="_blank">지원 페이지 ↗</a>`;
  const srcNote=a.scanned?'':'<div class="manual-note" style="border-color:color-mix(in srgb,var(--warn) 40%,transparent);color:var(--warn)">⚠ 로컬 소스 미연결 — 코드 스캔 항목(데이터/장애/QA/보안/UX/성장)은 확인 불가로 표시됩니다.</div>';
  document.getElementById('modal').innerHTML=`
    <div class="mhd"><button class="close" onclick="closeM()">✕</button>
      <h2>${a.name} <span class="muted" style="font-size:14px;font-weight:400">${a.nameEn||''}</span></h2>
      <div class="tag">${a.tagline||''}</div></div>
    <div class="mbody">
      <div class="mtop">
        <div class="bigring" style="--p:${p};--c:${ringColor(p)}"><i>${p}</i></div>
        <div class="mstat">
          <div><b>${comp}%</b>완성도(자동측정)</div>
          <div><b>v${a.ver||'—'}</b>${a.status||''}</div>
          <div><b>${a.rating?'★'+a.rating:'—'}</b>${a.ratingCount?a.ratingCount+'개 평가':'평점 없음'}</div>
          <div><b>${done}/${tot}</b>태스크 완료</div>
          <div><b><span class="b ${MODEL_CLS[a.model]}">${MODEL_KR[a.model]}</span></b>유료화</div>
        </div>
      </div>
      ${links?'<div style="margin:-4px 0 4px">'+links+'</div>':''}${iap}
      ${srcNote}
      <div class="sec-t">발달 성숙도 · 8축 (100점 만점)</div>
      <div class="axes">${axes}</div>
      <div class="sec-t">완성도 체크리스트 · 영역별</div>
      <div class="catgrid">${cats}</div>
      <div class="manual-note">${MANUAL}</div>
    </div>`;
  document.getElementById('ov').classList.add('show');document.body.style.overflow='hidden';
}
function closeM(){document.getElementById('ov').classList.remove('show');document.body.style.overflow='';}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM();});
roll();render();
</script></body></html>
